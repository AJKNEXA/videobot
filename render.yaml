services:
  - type: web
    name: videobot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: DAILY_LIMIT
        value: 5
      - key: REFERRALS_NEEDED
        value: 3
      - key: DELETE_AFTER
        value: 600
